name: Verify structural example
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download standard Godot 4.7.2 and check its release checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/car-sim-godot"
          cd "$RUNNER_TEMP/car-sim-godot"
          curl --fail --location --retry 3 --output Godot_v4.7.2-stable_linux.x86_64.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output SHA512-SUMS.txt https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          sha512sum --ignore-missing --check SHA512-SUMS.txt
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Check package and cabin configuration
        run: |
          python3 tools/demo.py check
          python3 model/source/test_cabin_fit.py
      - name: Run shared physics, baked damage, roof tuning and multi-car checks
        run: python3 tools/demo.py verify --godot "$RUNNER_TEMP/car-sim-godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-sim-verification
          path: |
            verification/*.json
            verification/**/*.json
            verification/**/*.csv
          if-no-files-found: ignore
